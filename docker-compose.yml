services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/hubspot_ai
      HUBSPOT_REDIRECT_URI: http://localhost:8000/api/v1/auth/hubspot/callback
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hubspot_ai
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d hubspot_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
